<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Three-stage Rogers — work in progress</title>
<style>body{margin:24px;background:#111925;color:#fff;font:16px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}article{background:#253448;padding:16px;border-radius:12px}canvas{width:100%;height:auto}img{max-height:320px}button{padding:12px;font:inherit}small{color:#b9cce0}</style>
<h1>Three-stage Rogers — work in progress</h1><p>1: existing suit. 2: existing jersey. 3: new tropical outfit. These are art candidates, not the finished encounter.</p><img src="review33/rogers-tropical-stage3-reference.webp" alt="Tropical stage-three reference"><p>Four paired matchups required. Three candidates below; tropical Mamdani is being remade because his opponent's shirt changed color.</p><button id="toggle">Pause</button><main></main>
<script>
const clips=[['Tropical idle','tropical_idle33',442,630,12,4],['Mamdani × jersey','jersey_mamdani_grapple33',1280,562,12,4],['El-Sayed × jersey','jersey_sayed_punch35_clean',793,658,7,3,8],['El-Sayed × tropical','tropical_sayed_grapple33',866,663,7,3]];let paused=false,t=0,last=performance.now();const cards=[];
toggle.onclick=()=>{paused=!paused;toggle.textContent=paused?'Play':'Pause'};
for(const [name,file,w,h,n,cols,fps=6] of clips){const a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><canvas width="640" height="400"></canvas><small>${n} saved frames · native Makko bake · pending in-game identity/scale check</small>`;document.querySelector('main').append(a);const img=new Image();img.src='review33/mike_rogers_'+file+'.webp';cards.push({img,w,h,n,cols,fps,ctx:a.querySelector('canvas').getContext('2d')});}
function draw(now){if(!paused)t+=(now-last)/1000;last=now;for(const c of cards){if(!c.img.complete||!c.img.naturalWidth)continue;const k=Math.floor(t*c.fps)%c.n,s=Math.min(620/c.w,360/c.h);c.ctx.clearRect(0,0,640,400);c.ctx.drawImage(c.img,(k%c.cols)*(c.w+4)+2,Math.floor(k/c.cols)*(c.h+4)+2,c.w,c.h,(640-c.w*s)/2,390-c.h*s,c.w*s,c.h*s);}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
