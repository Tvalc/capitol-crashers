<!doctype html><meta charset="utf-8"><title>Citizen departure QA</title><style>body{background:#111722;color:#fff;font:18px system-ui;margin:24px}canvas{width:100%;max-width:1100px;background:#242936}button{padding:10px;margin:5px}</style><h1>Happy citizen departures</h1><p id="status">Loading game renderer and all five departure sheets…</p><button id="toggle">Pause</button><button id="flip">Face left</button><canvas width="1100" height="360"></canvas><script type="module">
import {loadSprites,drawSprite,hasSheet,clipFor} from './src/sprites.js?v=citizen-happy3';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),names=['hungry','evicted','worker','sick','witness'];let t=0,last=0,pause=false,facing=1;
await loadSprites();const valid=names.every(n=>hasSheet('citizen_'+n,'depart'))&&clipFor('leaving')==='depart'&&clipFor('follow')==='walk';document.querySelector('#status').textContent=valid?'PASS: all five departure sheets loaded; departure and witness-follow states resolve separately.':'FAIL: a sheet or state mapping is missing';
document.querySelector('#toggle').onclick=()=>{pause=!pause;document.querySelector('#toggle').textContent=pause?'Play':'Pause'};document.querySelector('#flip').onclick=()=>{facing*=-1;document.querySelector('#flip').textContent=facing===1?'Face left':'Face right'};
function tick(now){if(!pause)t+=last?(now-last)/1000:0;last=now;ctx.clearRect(0,0,1100,360);ctx.fillStyle='#ddd';ctx.font='16px system-ui';names.forEach((n,i)=>{let x=110+i*220;ctx.fillText(n,x-50,34);ctx.strokeStyle='#657086';ctx.beginPath();ctx.moveTo(x-95,320);ctx.lineTo(x+95,320);ctx.stroke();drawSprite(ctx,{team:'citizen',sprite:'citizen_'+n,state:'leaving',stateT:t,anim:t,y:320,facing,z:0,flash:0},x,1)});requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
