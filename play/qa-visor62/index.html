<!doctype html><meta charset="utf-8"><base href="/play/"><title>Rogers visor — motion check</title><style>body{background:#182233;color:#fff;font:16px system-ui}canvas{background:linear-gradient(90deg,#253854,#857b9d);max-width:100%}</style><h1>Rogers visor: every walk and run frame</h1><p id="status">Loading actual game renderer…</p><canvas width="1320" height="720"></canvas><script type="module">
import{loadSprites,drawSprite}from './qa-level60/src/sprites.js?v=cast62';
const c=document.querySelector('canvas'),g=c.getContext('2d');try{await loadSprites();document.querySelector('#status').textContent='Actual game rendering, opaque visor attachment. Walk above, run below.';for(const [row,state]of ['walk','run'].entries())for(let i=0;i<(row?12:10);i++){g.fillText(state+' '+i,15+i*110,25+row*350);drawSprite(g,{sprite:'rogers_tropical',kind:'rogers',state,anim:(i+.01)/8,y:325+row*350,facing:1},55+i*110,.85);}}catch(e){document.querySelector('#status').textContent=e.message;}
</script>
